<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="LOCACTION: выберите точку на карте Москвы и узнайте, как место подходит для вашего бизнеса.">
  <meta name="theme-color" content="#f7f3e8">
  <title>LOCACTION - где открыть точку</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app/app.css">
  <link rel="stylesheet" href="app/result.css">
  <script type="module" src="app/main.mjs"></script>
</head>
<body data-screen="home" data-map="loading">
  <header class="topbar">
    <a class="wordmark" href="./" data-action="home" aria-label="LOCACTION, на главную"><span class="brand-mark" aria-hidden="true"></span>LOCACTION</a>
    <ol class="stepper" aria-label="Шаги">
      <li data-step="map"><button type="button" data-action="step-map"><span class="step-dot">1</span><span class="step-label">Точка</span></button></li>
      <li data-step="form"><button type="button" data-action="step-form"><span class="step-dot">2</span><span class="step-label">Бизнес</span></button></li>
      <li data-step="result"><button type="button" data-action="step-result"><span class="step-dot">3</span><span class="step-label">Карточка</span></button></li>
    </ol>
    <button class="compare-badge" type="button" data-action="compare" hidden aria-label="Сравнение точек"><span class="compare-icon"></span><span class="compare-count">0</span></button>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow">Москва · стрит-ритейл</p>
        <h1 id="hero-title">Где открыть<br>точку?</h1>
        <p class="hero-lead">Выберите место на карте - покажем, что вокруг помогает бизнесу, а что мешает.</p>
      </div>
      <div class="hero-search" id="search"></div>
      <a class="hero-example" href="example.html">Пример: 3 адреса в Митино</a>
    </section>

    <div class="map-shell" id="map-shell">
      <div class="map" id="map" role="region" aria-label="Карта Москвы"></div>
      <img class="map-fallback" src="mitino.webp" alt="" width="1100" height="810" loading="lazy">
      <p class="map-status" role="status">Загружаем карту…</p>
      <button class="map-expand" type="button" data-action="expand">
        <span class="map-expand-icon"></span><span>Развернуть карту</span>
      </button>
      <div class="map-tools">
        <button class="icon-button" type="button" data-action="zoom-in" aria-label="Приблизить"></button>
        <button class="icon-button" type="button" data-action="zoom-out" aria-label="Отдалить"></button>
        <button class="icon-button" type="button" data-action="collapse" aria-label="Свернуть карту"></button>
      </div>
      <p class="map-hint" aria-live="polite">Нажмите на здание</p>
      <section class="pick-card" id="pick-card" aria-live="polite" hidden></section>
      <canvas class="smoke" id="smoke" aria-hidden="true"></canvas>
      <small class="map-credit"><a href="https://www.openstreetmap.org/copyright">© участники OpenStreetMap</a></small>
    </div>

    <aside class="sheet" id="sheet" aria-live="polite"></aside>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <noscript><p class="noscript">Включите JavaScript, чтобы открыть карту.</p></noscript>
</body>
</html>
